<form method="POST" action="/login">

    <div class="mb-3">
        <label class="form-label">
            Email
        </label>

        <input type="email"
               name="email"
               class="form-control"
               placeholder="Enter your email"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Password
        </label>

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Enter your password"
               required>
    </div>

    <button type="submit"
            class="btn btn-primary w-100">
        Login
    </button>

</form>
