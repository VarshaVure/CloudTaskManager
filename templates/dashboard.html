<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Cloud Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand" href="/dashboard">
                Cloud Task Manager
            </a>

            <a href="/logout"
               class="btn btn-light">
                Logout
            </a>

        </div>

    </nav>


    <div class="container mt-5">

        <!-- Welcome -->
        <div class="text-center">

            <h1>
                Welcome, {{ user_name }}! 👋
            </h1>

            <p class="lead">
                Manage your tasks from your dashboard.
            </p>

        </div>


        <!-- Add Task -->
        <div class="card shadow mt-4">

            <div class="card-body">

                <h3>
                    Add a New Task
                </h3>

                <form method="POST"
                      action="/add_task"
                      class="mt-3">

                    <div class="mb-3">

                        <label class="form-label">
                            Task
                        </label>

                        <input type="text"
                               name="task"
                               class="form-control"
                               placeholder="Enter your task"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary">
                        Add Task
                    </button>

                </form>

            </div>

        </div>


        <!-- Task List -->
        <div class="card shadow mt-4">

            <div class="card-body">

                <h3>
                    Your Tasks
                </h3>

                {% if tasks %}

                    <ul class="list-group mt-3">

                        {% for task in tasks %}

                            <li class="list-group-item d-flex justify-content-between">

                                <span>
                                    {{ task[2] }}
                                </span>

                                <span class="badge bg-warning text-dark">
                                    {{ task[3] }}
                                </span>

                            </li>

                        {% endfor %}

                    </ul>

                {% else %}

                    <p class="text-muted mt-3">
                        You don't have any tasks yet.
                    </p>

                {% endif %}

            </div>

        </div>

    </div>

</body>

</html>
